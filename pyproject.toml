[project]
name = "didhub-build-tools"
version = "0.1.0"
description = "Build tools for DIDAlterHub project"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.3",
    "Jinja2>=3.1.6",
    "requests>=2.33.1",
    "urllib3>=2.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.4.0",
]

[project.scripts]
didhub-build = "build_tools.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["build_tools*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "PT",
    "RET",
    "SIM",
    "ARG",
    "PTH",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["build_tools"]

[tool.pytest.ini_options]
testpaths = ["build_tools/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
